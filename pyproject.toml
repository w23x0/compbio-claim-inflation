[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compbio-claim-inflation"
version = "1.2.0"
description = "Ground-truth, detector and red/blue adversarial harness for inflation in computational-biology claims"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "compbio-claim-inflation contributors" }]
keywords = ["computational-biology", "reproducibility", "red-teaming", "survival-analysis", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
  "pydantic>=2.6",
  "requests>=2.31",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=8.0"]

[project.scripts]
cbi = "cbi.cli:main"
cbi-grader-http = "cbi.m6.api:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
