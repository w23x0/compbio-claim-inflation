# Evidence-checklist lexicon used by the content-only detector (M4).
# Blue-team updates append patterns under `learned_patterns`; they are versioned
# in models/detector_*.json.  Patterns are case-insensitive regular expressions.
version: 1
patterns:
  optimal_cutpoint:
    - "optimal (cut|cut-?off|threshold|cutpoint)"
    - "optimally selected"
    - "maximally selected"
    - "maxstat"
    - "x-?tile"
    - "youden"
    - "roc[- ](curve|derived|based)"
    - "data[- ]driven (cut|threshold|cutpoint)"
    - "minimum p[- ]value"
    - "log[- ]rank statistic (was|were) (used|maximi[sz]ed|scanned)"
    - "maxi[sz]ed the log[- ]rank"
    - "maxi[sz]e the log[- ]rank"
    - "scanning (all )?candidate cutpoints"
    - "derived by scanning"
    - "selected (the )?(value|cutpoint|threshold) that maxi"
    - "threshold (that )?maxi[sz]ed"
    - "maxi[sz]miz(e|ing) separation"
    - "cut-?off (was|were) (searched|scanned|optimized|optimised)"
    - "cutpoint (was|were) (searched|scanned|optimized|optimised)"
    - "best[- ]separat"
    - "change[- ]point"
  transparent_cutpoint:
    - "median"
    - "tertile"
    - "quartile"
    - "prespecified cut"
    - "pre-?specified cut"
    - "a priori (cut|threshold|split)"
    - "predefined (cut|threshold|split)"
    - "50th percentile"
    - "upper third"
    - "lower third"
    - "continuous variable"
    - "per (1 |one )?standard deviation"
    - "standardi[sz]ed expression"
  subgroup:
    - "subgroup"
    - "sub-?group"
    - "restricted to (stage|patients|those)"
    - "stage i[-–]ii only"
    - "stage iii[-–]iv only"
    - "post[- ]hoc"
    - "among patients with"
    - "exploratory (subset|subgroup|analysis)"
    - "best[- ]performing (subset|stratum)"
    - "focused on (patients with )?(early|advanced)"
    - "early[- ]stage disease"
    - "locally advanced disease"
  validation:
    - "independent (cohort|dataset|validation)"
    - "external validation"
    - "validation (cohort|set|study)"
    - "replicat(e|ed|ion)"
    - "validated in"
    - "independent series"
  multiple_testing:
    - "multiple (comparisons|testing|tests)"
    - "bonferroni"
    - "benjamini"
    - "false discovery"
    - "fdr"
    - "adjusted for multiple"
    - "correction for multiple"
  many_candidates:
    - "among (\\d{2,}|twenty|thirty|forty|fifty|sixty|hundreds of) (candidate |putative )?(genes|probes|markers)"
    - "(\\d{2,}|hundreds of) (candidate |putative )?(genes|probes|markers) (were|was) (tested|screened|evaluated)"
    - "screened (\\d{2,}|hundreds of)"
    - "genome[- ]wide"
  data_code:
    - "data (are|is) (available|deposited)"
    - "code (is|are) available"
    - "analysis code"
    - "raw data (are|is) available"
  endpoint_switch:
    - "several endpoints"
    - "multiple endpoints"
    - "among the (available )?endpoints"
    - "most favourable endpoint"
    - "most favorable endpoint"
    - "we (selected|chose) the endpoint"
  covariate_fishing:
    - "we (tested|evaluated) (several|multiple|different) (models|covariate|adjustment)"
    - "covariates were (selected|chosen)"
    - "stepwise"
    - "best[- ]fitting model"
  probe_selection:
    - "probe (with|showing) the (most|strongest) significant"
    - "most significant probe"
    - "probe selected by"
    - "among (multiple|several) probes"
  followup_custom:
    - "follow[- ]up (was )?(truncated|capped)"
    - "\\b(2|3|4|10)[- ]year (follow[- ]up|cut[- ]off)"
    - "administrative censoring at"
  significance_language:
    - "statistically significant"
    - "significantly (associated|correlated|worse|better)"
    - "trend toward"
  prespecified:
    - "prespecified hypothesis"
    - "pre-?specified hypothesis"
    - "primary (analysis|endpoint|hypothesis)"
    - "all (patients|samples) were included"
    - "no (patients|samples) were excluded"
    - "we did not (select|optimize)"
  novelty:
    - "first (study|report|time)"
    - "novel (biomarker|marker|signature)"
    - "previously unreported"
  limitations:
    - "limitations"
    - "retrospective"
    - "single[- ]cohort"
    - "lack of (external )?validation"
  ci:
    - "95% (confidence interval|ci)"
    - "confidence interval"
  pvalue:
    - "p ?[<=] ?0?\\.[0-9]+"
  hr:
    - "hazard ratio"
    - "\\bhr\\b"
  percentiles:
    - "(\\d{2})(st|nd|rd|th) percentile"
    - "percentile[- ]based"
  best_subset_language:
    - "best[- ]performing"
    - "strongest association"
    - "most promising"
    - "selected because"
    - "we chose the"
    - "optimal (model|subset|stratum)"
learned_patterns: {}
